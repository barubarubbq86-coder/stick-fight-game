<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'"><title>棒人間fight</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"></head><body><main><header><h1>棒人間<span>fight</span></h1><p>3D BATTLE SIMULATOR</p><button id="install" hidden>インストール</button></header><section id="setup"><div class="intro"><b>両チームを編成しよう</b><span>人数を入力 → FIGHT。横持ちがおすすめ。</span></div><div class="teams"><section class="team a"><h2>TEAM A <small>青チーム</small></h2><div id="roster0"></div><p id="total0"></p></section><section class="team b"><h2>TEAM B <small>赤チーム</small></h2><div id="roster1"></div><p id="total1"></p></section></div><div class="actions"><button id="demo">おすすめ編成</button><button id="clear">全員クリア</button><button id="fight" class="primary">FIGHT / 戦闘開始</button></div><p id="notice" role="status">種類を混ぜて、大軍同士の戦いも楽しめます。</p></section><section id="battle" hidden><div class="hud"><div><b>TEAM A 総合HP</b><progress id="hp0" max="1" value="1"></progress><small id="stats0"></small></div><strong id="clock">0:00</strong><div><b>TEAM B 総合HP</b><progress id="hp1" max="1" value="1"></progress><small id="stats1"></small></div></div><div id="arena"><canvas id="canvas"></canvas><div id="result" hidden><h2 id="winner"></h2><button id="again" class="primary">もう一度</button><button id="back">キャラクター選択へ</button></div><span id="dumbbellLabel" hidden>1t</span><output id="selected">棒人間をタップすると個人HPを表示</output></div><div class="placement"><button id="placeToggle" aria-pressed="false">キャラを追加配置</button><div id="placeOptions" hidden><label>チーム <select id="placeTeam"><option value="0">TEAM A（青）</option><option value="1">TEAM B（赤）</option></select></label><label>キャラ <select id="placeType"></select></label><button id="placeEnd">配置終了</button></div><p id="placeStatus" role="status">通常操作：ドラッグでカメラを操作</p></div><div class="controls"><button id="pause">一時停止</button><button id="resetCamera">全体へ戻る</button><label>速度 <select id="speed"><option value="1">1倍</option><option value="2">2倍</option><option value="4">4倍</option></select></label><label>ドラッグ <select id="cameraMode"><option value="orbit">回転</option><option value="pan">移動</option></select></label><button id="return">編成へ</button><span id="performance"></span></div><p class="hint">1本指で回転・角度変更 / 2本指で移動とピンチズーム / PCは右ドラッグで移動・ホイールでズーム</p></section><footer>端末内で動作 · 広告なし · 個人情報の収集なし</footer></main><script type="module" src="game.js"></script></body></html>
